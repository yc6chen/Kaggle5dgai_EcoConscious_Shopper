[pytest]
# Pytest configuration for Eco-Conscious Shopper tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.11

# Add current directory to Python path
pythonpath = .

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multi-agent workflows
    slow: Tests that take longer to run
    requires_api: Tests that require API credentials

# Asyncio mode
asyncio_mode = auto

# Coverage options (when using pytest-cov)
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage report options (uncomment when running with --cov)
# --cov=agents
# --cov=models
# --cov=tools
# --cov-report=html
# --cov-report=term-missing

# Log format
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
